[package]
name = "wikiagents"
version = "1.1.0"
edition = "2021"
description = "Find, search, and read every AI coding session you've ever had - across Claude Code, Codex, Antigravity, OpenCode, Qoder, Cline, and more."
license = "MIT"
repository = "https://github.com/AlexZander85/wikiagents"
keywords = ["claude-code", "codex", "gemini-cli", "sessions", "search"]
categories = ["command-line-utilities"]
exclude = [
    "docs/*.webp",
    "docs/*.mp4",
    "docs/banner*.png",
    "docs/banner.html",
    "docs/social-preview.png",
    "scripts/make_banner.*",
    ".playwright-mcp",
]

[lib]
name = "sessionwiki"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tiny_http = "0.12"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7"
unicode-normalization = "0.1"
sha2 = "0.11"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao"]

[[bin]]
name = "wikiagents"
path = "src/main.rs"

[[bin]]
name = "wikiagents-app"
path = "src/bin/app.rs"
required-features = ["gui"]

[[bin]]
name = "agentwiki"
path = "src/main.rs"

[[bin]]
name = "agentwiki-app"
path = "src/bin/app.rs"
required-features = ["gui"]

[[bin]]
name = "sessionwiki"
path = "src/main.rs"

[[bin]]
name = "sessionwiki-app"
path = "src/bin/app.rs"
required-features = ["gui"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
