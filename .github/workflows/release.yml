name: Release

# Builds prebuilt binaries for every tagged version (or manual trigger)
# and attaches them to the GitHub Release (Windows, macOS, Linux).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build all binaries (CLI + Desktop GUI)
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_KEY_PEM: ${{ secrets.MACOS_SIGNING_KEY_PEM }}
          SIGNING_CERT_PEM: ${{ secrets.MACOS_SIGNING_CERT_PEM }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY_PEM" ] && [ -n "$SIGNING_CERT_PEM" ]; then
            v=0.29.0
            a=apple-codesign-$v-macos-universal
            curl -fsSL -o "$a.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$a.tar.gz"
            echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $a.tar.gz" | shasum -a 256 -c -
            tar xzf "$a.tar.gz"
            umask 077
            printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/key.pem"
            printf '%s\n' "$SIGNING_CERT_PEM" > "$RUNNER_TEMP/cert.pem"
            for b in sessionwiki sessionwiki-app agentwiki agentwiki-app wikiagents wikiagents-app; do
              bin="target/${{ matrix.target }}/release/$b"
              if [ -f "$bin" ]; then
                "./$a/rcodesign" sign --pem-source "$RUNNER_TEMP/key.pem" --pem-source "$RUNNER_TEMP/cert.pem" \
                  --binary-identifier "com.alexzander.$b" "$bin"
                codesign --verify "$bin"
              fi
            done
            rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.pem"
          else
            echo "No macOS signing secrets configured; continuing with standard binaries"
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target_dir="target/${{ matrix.target }}/release"
          tag="${{ github.ref_name }}"
          [ "$tag" = "main" ] && tag="latest"
          dist="agentwiki-${tag}-${{ matrix.target }}"
          mkdir -p "$dist"
          
          # CLI binary
          cp "$target_dir/sessionwiki" "$dist/agentwiki"
          cp "$target_dir/sessionwiki" "$dist/sessionwiki"
          cp "$target_dir/sessionwiki" "$dist/wikiagents"
          
          # GUI binary if present
          if [ -f "$target_dir/sessionwiki-app" ]; then
            cp "$target_dir/sessionwiki-app" "$dist/agentwiki-app"
            cp "$target_dir/sessionwiki-app" "$dist/sessionwiki-app"
            cp "$target_dir/sessionwiki-app" "$dist/wikiagents-app"
          fi
          
          cp README.md README.ru.md LICENSE "$dist/"
          tar czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"

          dist_wa="wikiagents-${tag}-${{ matrix.target }}"
          cp -r "$dist" "$dist_wa"
          tar czf "$dist_wa.tar.gz" "$dist_wa"
          shasum -a 256 "$dist_wa.tar.gz" > "$dist_wa.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target_dir="target/${{ matrix.target }}/release"
          tag="${{ github.ref_name }}"
          [ "$tag" = "main" ] && tag="latest"
          dist="agentwiki-${tag}-${{ matrix.target }}"
          mkdir -p "$dist"
          
          # CLI binary
          cp "$target_dir/sessionwiki.exe" "$dist/agentwiki.exe"
          cp "$target_dir/sessionwiki.exe" "$dist/sessionwiki.exe"
          cp "$target_dir/sessionwiki.exe" "$dist/wikiagents.exe"
          
          # GUI binary
          if [ -f "$target_dir/sessionwiki-app.exe" ]; then
            cp "$target_dir/sessionwiki-app.exe" "$dist/agentwiki-app.exe"
            cp "$target_dir/sessionwiki-app.exe" "$dist/sessionwiki-app.exe"
            cp "$target_dir/sessionwiki-app.exe" "$dist/wikiagents-app.exe"
          fi
          
          cp README.md README.ru.md LICENSE "$dist/"
          7z a "$dist.zip" "$dist" >/dev/null
          certutil -hashfile "$dist.zip" SHA256 | sed -n 2p > "$dist.zip.sha256"

          dist_wa="wikiagents-${tag}-${{ matrix.target }}"
          cp -r "$dist" "$dist_wa"
          7z a "$dist_wa.zip" "$dist_wa" >/dev/null
          certutil -hashfile "$dist_wa.zip" SHA256 | sed -n 2p > "$dist_wa.zip.sha256"

      - name: Build the release notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f scripts/release-notes.sh ]; then
            sh scripts/release-notes.sh "$TAG" > RELEASE_NOTES.md || true
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "# AgentWiki $TAG" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "Automated release build for Windows, macOS, and Linux." >> RELEASE_NOTES.md
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            agentwiki-*.tar.gz
            agentwiki-*.tar.gz.sha256
            agentwiki-*.zip
            agentwiki-*.zip.sha256
            wikiagents-*.tar.gz
            wikiagents-*.tar.gz.sha256
            wikiagents-*.zip
            wikiagents-*.zip.sha256
          fail_on_unmatched_files: false
